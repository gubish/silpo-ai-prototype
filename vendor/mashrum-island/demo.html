<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Машрум · демо інтеграції</title>
<style>
  html,body{margin:0;height:100%;background:#e9ebe3;font-family:"Onest",system-ui,sans-serif}
  .screen{position:relative;width:390px;max-width:100%;height:844px;margin:24px auto;background:#F4F5FA;border-radius:40px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
  .content{padding:60px 20px;color:#6b6f80;font-size:14px;line-height:1.5}
  /* app chrome at the bottom: the widget sits flush on top of the nav bar */
  .bottom{position:absolute;left:0;right:0;bottom:0}
  .navbar{position:relative;z-index:1;height:81px;background:#fff;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8a8e9c}
  mashrum-island{display:block}
  .log{max-width:390px;margin:0 auto 24px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#444;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="screen">
    <div class="content">Тут ваш екран прототипу.</div>
    <div class="bottom">
      <mashrum-island id="mashrum"></mashrum-island>
      <nav class="navbar"><span>Головна</span><span>Доставка</span><span>Кошик</span><span>В магазині</span><span>Покупки</span></nav>
    </div>
  </div>
  <div class="log" id="log"></div>

  <script src="mashrum-island.js"></script>
  <script>
    const el = document.getElementById('mashrum');
    const log = m => document.getElementById('log').textContent = m + '\n' + document.getElementById('log').textContent;

    // Тап по стрілці: тут відкриваємо чат із передзаповненим полем.
    el.addEventListener('mashrum-cta', e => {
      e.preventDefault();                       // вимикає вбудоване демо «думаю → готово»
      log('→ відкрити чат з текстом: «' + e.detail.text + '»');
      // openChat({ prefill: e.detail.text });  // ← ваш код
    });
    el.addEventListener('mashrum-collapse', () => log('згорнуто'));
    el.addEventListener('mashrum-expand', () => log('розгорнуто'));
  </script>
</body>
</html>
